# TEMPORÁRIO, somente leitura: estado da máquina e logs recentes (diagnóstico de reinícios).
name: Diagnostico Fly (somente leitura)
on:
  push:
    branches: [ops/diagnostico-fly]
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Maquinas
        run: flyctl machine list -a os-marcavento || true
      - name: Eventos da maquina
        run: |
          for id in $(flyctl machine list -a os-marcavento --json | jq -r '.[].id'); do
            flyctl machine status "$id" -a os-marcavento --display-config=false || true
          done
      - name: Logs recentes
        run: timeout 60 flyctl logs -a os-marcavento --no-tail | grep -v "api/contatos/sync\|api/next-orcamento" | tail -n 200 || true
