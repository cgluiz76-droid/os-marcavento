# Operação pontual: restaura as O.S. 9, 10, 16 e 17 a partir da cópia (snapshot)
# do volume de dados tirada antes da sincronização acidental de 05/11/2026 20:51 UTC.
#
# Segurança:
# - Roda só nesta branch (ops/restaurar-os); não faz deploy e não toca no volume os_data.
# - Cria um volume TEMPORÁRIO a partir do snapshot e uma máquina TEMPORÁRIA sem portas
#   (não recebe tráfego); ambos são apagados no final, mesmo em caso de erro.
# - O script só regrava uma O.S. se a cópia for anterior à sincronização E se a O.S.
#   não tiver sido alterada depois dela.
# - Nenhum dado de cliente é impresso (o log deste repositório é público).
name: Restaurar O.S. do snapshot

on:
  push:
    branches: [ops/restaurar-os]

concurrency: fly-deploy

jobs:
  restaurar:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: os-marcavento
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Escolher o snapshot anterior à sincronização
        working-directory: /tmp
        run: |
          set -euo pipefail
          flyctl volumes list -a "$APP" --json > vols.json
          VOL=$(jq -r '.[] | select(.name=="os_data") | .id' vols.json | head -n1)
          REGION=$(jq -r --arg v "$VOL" '.[] | select(.id==$v) | .region' vols.json)
          flyctl volumes snapshots list "$VOL" -a "$APP" --json > snaps.json
          echo "Snapshots disponíveis (id / criado em):"
          jq -r '.[] | [.id, (.created_at // .CreatedAt)] | @tsv' snaps.json
          SNAP=$(jq -r '[.[] | {id, t: (.created_at // .CreatedAt)} | select(.t >= "2026-11-05T20:40:00" and .t < "2026-11-05T20:51:30")] | sort_by(.t) | last | .id' snaps.json)
          if [ -z "$SNAP" ] || [ "$SNAP" = "null" ]; then echo "Nenhum snapshot entre 20:40 e 20:51 UTC. Abortando sem mexer em nada."; exit 1; fi
          echo "Usando snapshot: $SNAP (região $REGION)"
          echo "SNAP=$SNAP" >> "$GITHUB_ENV"
          echo "REGION=$REGION" >> "$GITHUB_ENV"

      - name: Criar volume temporário a partir do snapshot
        working-directory: /tmp
        run: |
          set -euo pipefail
          flyctl volumes create os_restore_tmp --snapshot-id "$SNAP" --region "$REGION" --size 1 --require-unique-zone=false -a "$APP" --yes --json > newvol.json
          RVOL=$(jq -r '.id // .ID' newvol.json)
          echo "Volume temporário: $RVOL"
          echo "RVOL=$RVOL" >> "$GITHUB_ENV"

      - name: Rodar a restauração numa máquina temporária
        working-directory: /tmp
        run: |
          set -euo pipefail
          SCRIPT_B64=$(base64 -w0 "$GITHUB_WORKSPACE/ops/restaurar-os.js")
          flyctl machine run node:24-slim \
            -a "$APP" --region "$REGION" --name os-restore-tmp \
            --volume "$RVOL:/restore" --restart no --vm-memory 256 \
            --env SCRIPT_B64="$SCRIPT_B64" --detach \
            -- node -e "eval(Buffer.from(process.env.SCRIPT_B64,'base64').toString())"
          MID=$(flyctl machine list -a "$APP" --json | jq -r '.[] | select(.name=="os-restore-tmp") | .id' | head -n1)
          echo "MID=$MID" >> "$GITHUB_ENV"
          for i in $(seq 1 36); do
            STATE=$(flyctl machine list -a "$APP" --json | jq -r --arg m "$MID" '.[] | select(.id==$m) | .state')
            echo "estado: $STATE"
            case "$STATE" in stopped|destroyed|failed) break;; esac
            sleep 5
          done
          sleep 5
          flyctl logs -a "$APP" --machine "$MID" --no-tail | grep -E "O\.S\. id|RESULTADO|ERRO" | sed 's/^.*\] //' | tee result.txt || true
          grep -q "RESULTADO 4/4" result.txt

      - name: Apagar máquina e volume temporários
        if: always()
        working-directory: /tmp
        run: |
          if [ -n "${MID:-}" ]; then flyctl machine destroy "$MID" -a "$APP" --force || true; fi
          MID2=$(flyctl machine list -a "$APP" --json | jq -r '.[] | select(.name=="os-restore-tmp") | .id' | head -n1)
          if [ -n "$MID2" ]; then flyctl machine destroy "$MID2" -a "$APP" --force || true; fi
          sleep 5
          if [ -n "${RVOL:-}" ]; then flyctl volumes destroy "$RVOL" -a "$APP" --yes || true; fi
          echo "Volumes restantes:"; flyctl volumes list -a "$APP"
          echo "Máquinas restantes:"; flyctl machine list -a "$APP"
