# fly.toml app configuration file generated for os-marcavento on 2026-10-28T14:47:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'os-marcavento'
# São Paulo: mais perto dos usuários e do Moskit
primary_region = 'gru'

[build]

[env]
  # server.js escuta em process.env.PORT (padrão 3000); precisa bater com internal_port
  PORT = '8080'

# Banco SQLite e fotos ficam em /app/data. Sem este volume, tudo seria apagado
# a cada deploy e a cada vez que a máquina para por inatividade.
[mounts]
  source = 'os_data'
  destination = '/app/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Deploy só é considerado bem-sucedido se a API responder (banco aberto no volume)
  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/api/next-orcamento'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
